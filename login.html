<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Owner Login — Bearded Guys</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --clr-bg:        #0d0d0d;
      --clr-surface:   #141414;
      --clr-gold:      #c8a44a;
      --clr-gold-dim:  rgba(200,164,74,.15);
      --clr-text:      #f0f0f0;
      --clr-muted:     #888;
      --clr-border:    rgba(255,255,255,.1);
      --clr-error:     #e05a5a;
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--clr-bg);
      color: var(--clr-text);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    .login-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(200,164,74,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 70%, rgba(200,164,74,.07) 0%, transparent 60%),
        url('https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=1600&q=60') center/cover no-repeat;
      filter: brightness(.35);
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: min(440px, 92vw);
    }

    /* Glassmorphism card */
    .login-card {
      background: rgba(20, 20, 20, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(200,164,74,.2);
      border-radius: 20px;
      padding: clamp(2rem, 6vw, 3rem);
      box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .login-logo img { height: 48px; width: auto; }

    .login-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      letter-spacing: .06em;
      text-align: center;
      color: var(--clr-text);
      margin-bottom: .4rem;
    }
    .login-sub {
      text-align: center;
      font-size: .875rem;
      color: var(--clr-muted);
      margin-bottom: 2rem;
    }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      margin-bottom: 1.1rem;
    }
    .form-group label {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--clr-muted);
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--clr-muted);
      pointer-events: none;
      display: flex;
    }

    .form-group input {
      width: 100%;
      padding: .85rem 1rem .85rem 2.8rem;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--clr-border);
      border-radius: 8px;
      color: var(--clr-text);
      font-family: var(--font-body);
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--clr-gold);
      box-shadow: 0 0 0 3px rgba(200,164,74,.2);
    }
    .form-group input:user-valid  { border-color: #4caf88; }
    .form-group input:user-invalid { border-color: var(--clr-error); }

    .input-valid-icon {
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #4caf88;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .form-group input:user-valid ~ .input-valid-icon { opacity: 1; }

    /* Error message */
    #login-error {
      display: none;
      background: rgba(224,90,90,.1);
      border: 1px solid rgba(224,90,90,.35);
      border-radius: 8px;
      padding: .75rem 1rem;
      color: var(--clr-error);
      font-size: .875rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
    #login-error.visible { display: block; }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 1rem;
      background: var(--clr-gold);
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: .1em;
      cursor: pointer;
      transition: background .2s, transform .2s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      margin-top: .5rem;
    }
    .btn-login:hover:not(:disabled) {
      background: #e0bc6e;
      transform: translateY(-1px);
      box-shadow: 0 0 24px rgba(200,164,74,.35);
    }
    .btn-login:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Back link */
    .login-back {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      margin-top: 1.75rem;
      font-size: .85rem;
      color: var(--clr-muted);
    }
    .login-back a { color: var(--clr-gold); font-weight: 500; }
    .login-back a:hover { color: #e0bc6e; }

    /* Gold bar at top of card */
    .card-accent {
      height: 3px;
      background: linear-gradient(90deg, var(--clr-gold), #e0bc6e, var(--clr-gold));
      border-radius: 20px 20px 0 0;
      margin: -clamp(2rem,6vw,3rem) -clamp(2rem,6vw,3rem) clamp(2rem,6vw,3rem);
    }
  </style>
</head>
<body>

  <div class="login-bg" aria-hidden="true"></div>

  <div class="login-wrap">
    <div class="login-card" role="main">
      <div class="card-accent"></div>

      <div class="login-logo">
        <img src="assets/logo.svg" alt="Bearded Guys" width="200" height="48" />
      </div>

      <h1 class="login-title">Owner Portal</h1>
      <p class="login-sub">Sign in to manage your gallery</p>

      <div id="login-error" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="owner@beardedguys.com"
              autocomplete="email"
              required
            />
            <span class="input-valid-icon" aria-hidden="true">✓</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              minlength="6"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="login-back">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <a href="index.html">Back to portfolio</a>
      </p>
    </div>
  </div>

  <!-- Supabase credentials -->
  <script src="js/config.js"></script>
  <script type="module">
    import { loginWithEmail, getSession } from './js/auth.js';

    // If already logged in, skip to admin
    const existing = await getSession();
    if (existing) window.location.href = 'admin.html';

    const form    = document.getElementById('login-form');
    const btn     = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }
    function clearError() {
      errorEl.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email    = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      const { error } = await loginWithEmail(email, password);

      if (error) {
        showError(error.message || 'Login failed. Please try again.');
        btn.disabled = false;
        btn.classList.remove('loading');
        return;
      }

      // Redirect on success
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
