<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barber Portal Login · Bearded Guys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./assets/brand/favicon.png" />
  <link rel="shortcut icon" href="./assets/brand/favicon.ico" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="./css/styles.css" />
  
  <style>
    /* Specific overrides for the login page to perfectly match the brand aesthetic */
    body {
      background: var(--paper-deep);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border: 1px solid var(--rule-strong);
      padding: 3rem 2.5rem;
      position: relative;
      box-shadow: 0 10px 40px rgba(33, 28, 21, 0.08);
    }
    
    /* Double hairline border effect typical in print */
    .login-container::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border: 1px solid var(--rule);
      pointer-events: none;
    }
    
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }
    
    .login-logo img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--rule-strong);
      padding: 2px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2rem;
    }
    
    .login-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    
    .login-sub {
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.85rem;
      color: var(--ink);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    .form-input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--rule-strong);
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: all 0.2s ease;
    }
    
    .form-input:focus {
      border-color: var(--ink);
      background: rgba(255, 255, 255, 0.4);
    }
    
    .form-input::placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }
    
    .btn-submit {
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: 1rem;
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
    }
    
    .btn-submit:hover {
      background: var(--ink-soft);
      border-color: var(--ink-soft);
    }
    
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.75rem;
      color: var(--ink-faint);
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .error-alert {
      display: none;
      background: var(--oxblood);
      color: var(--paper);
      padding: 0.75rem 1rem;
      font-family: var(--font-labels);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .error-alert.show {
      display: block;
    }
    
    .portal-footer {
      text-align: center;
      margin-top: 2.5rem;
      font-family: var(--font-labels);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .portal-footer a {
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }
    
    .portal-footer a:hover {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }
    
    .password-wrapper {
      position: relative;
    }
    
    .toggle-pass-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 0.5rem;
      display: flex;
      transition: color 0.2s;
    }
    
    .toggle-pass-btn:hover {
      color: var(--ink);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">
      <a href="./index.html" aria-label="Go to homepage">
        <img src="./assets/brand/logo-badge.png" alt="Bearded Guys Barbershop" />
      </a>
    </div>
    
    <div class="login-header">
      <h1 class="login-title">Owner Portal</h1>
      <p class="login-sub">Secure access · Authorized personnel only</p>
    </div>
    
    <div class="error-alert" id="error-alert" role="alert"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Sign in</button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button type="button" class="btn-submit btn-google" id="google-btn" style="background-color: #4285F4; border-color: #4285F4; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff"/>
      </svg>
      Sign in with Google
    </button>
    
    <div class="portal-footer">
      <a href="./index.html">Return to Public Site</a>
    </div>
  </div>

  <!-- Config & Scripts -->
  
  <script type="module">
    import { loginWithEmail, loginWithGoogle, completeGoogleRedirect, getSession } from './js/auth.js';

    const form = document.getElementById('login-form');
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('google-btn');
    const alertEl = document.getElementById('error-alert');

    function showError(msg) {
      alertEl.textContent = msg;
      alertEl.classList.add('show');
    }

    function googleBtnMarkup() {
      return `
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff"/>
        </svg>
        Sign in with Google
      `;
    }

    // Email + password sign-in
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.classList.remove('show');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const { data, error } = await loginWithEmail(emailEl.value.trim(), passEl.value);

      if (error) {
        showError(error.message || 'Invalid login credentials. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        return;
      }

      window.location.href = 'admin.html';
    });

    // Google sign-in (redirect flow)
    googleBtn.addEventListener('click', async () => {
      alertEl.classList.remove('show');

      googleBtn.disabled = true;
      googleBtn.textContent = 'Redirecting to Google...';

      const { error } = await loginWithGoogle();

      if (error) {
        showError(error.message || 'Google Authentication failed.');
        googleBtn.disabled = false;
        googleBtn.innerHTML = googleBtnMarkup();
      }
    });

    submitBtn.disabled = true;
    googleBtn.disabled = true;

    // Finish a Google redirect sign-in, then decide where to go
    const redirect = await completeGoogleRedirect();

    if (redirect.error) {
      showError(redirect.error.message);
      submitBtn.disabled = false;
      googleBtn.disabled = false;
    } else if (redirect.data) {
      window.location.href = 'admin.html';
    } else {
      // Auto redirect if already logged in
      const existing = await getSession();
      if (existing) {
        window.location.href = 'admin.html';
      } else {
        submitBtn.disabled = false;
        googleBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
