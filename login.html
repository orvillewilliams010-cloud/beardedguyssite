<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barber Portal Login · Bearded Guys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="./css/styles.css" />
  
  <style>
    /* Specific overrides for the login page to perfectly match the brand aesthetic */
    body {
      background: var(--paper-deep);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border: 1px solid var(--rule-strong);
      padding: 3rem 2.5rem;
      position: relative;
      box-shadow: 0 10px 40px rgba(33, 28, 21, 0.08);
    }
    
    /* Double hairline border effect typical in print */
    .login-container::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border: 1px solid var(--rule);
      pointer-events: none;
    }
    
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }
    
    .login-logo img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--rule-strong);
      padding: 2px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2rem;
    }
    
    .login-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    
    .login-sub {
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.85rem;
      color: var(--ink);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    .form-input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--rule-strong);
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: all 0.2s ease;
    }
    
    .form-input:focus {
      border-color: var(--ink);
      background: rgba(255, 255, 255, 0.4);
    }
    
    .form-input::placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }
    
    .btn-submit {
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: 1rem;
      font-family: var(--font-labels);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
    }
    
    .btn-submit:hover {
      background: var(--ink-soft);
      border-color: var(--ink-soft);
    }
    
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .error-alert {
      display: none;
      background: var(--oxblood);
      color: var(--paper);
      padding: 0.75rem 1rem;
      font-family: var(--font-labels);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .error-alert.show {
      display: block;
    }
    
    .portal-footer {
      text-align: center;
      margin-top: 2.5rem;
      font-family: var(--font-labels);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .portal-footer a {
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }
    
    .portal-footer a:hover {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }
    
    .password-wrapper {
      position: relative;
    }
    
    .toggle-pass-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 0.5rem;
      display: flex;
      transition: color 0.2s;
    }
    
    .toggle-pass-btn:hover {
      color: var(--ink);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">
      <a href="./index.html" aria-label="Go to homepage">
        <img src="./assets/logo.jpg" alt="Bearded Guys Barbershop" />
      </a>
    </div>
    
    <div class="login-header">
      <h1 class="login-title">Owner Portal</h1>
      <p class="login-sub">Secure access · Authorized personnel only</p>
    </div>
    
    <div class="error-alert" id="error-alert" role="alert"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="owner@beardedguys.com"
          autocomplete="email"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <button type="button" class="toggle-pass-btn" id="toggle-pass-btn" aria-label="Toggle password visibility">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn-submit" id="submit-btn">
        Sign In to Dashboard
      </button>
    </form>
    
    <div class="portal-footer">
      <a href="./index.html">Return to Public Site</a>
    </div>
  </div>

  <!-- Config & Scripts -->
  <script src="./js/config.js"></script>
  <script type="module">
    import { loginWithEmail, getSession } from './js/auth.js';

    // Auto redirect if already logged in
    const existing = await getSession();
    if (existing) {
      window.location.href = 'admin.html';
    }

    // Toggle password reveal
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pass-btn');

    toggleBtn?.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    });

    // Form submission
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertEl = document.getElementById('error-alert');

    function showError(msg) {
      alertEl.textContent = msg;
      alertEl.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.classList.remove('show');
      
      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Authenticating...';

      const { data, error } = await loginWithEmail(email, password);

      if (error) {
        showError(error.message || 'Invalid login credentials. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In to Dashboard';
        return;
      }

      // Success
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
