<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Owner &amp; Barber Portal — Bearded Guys Barbershop</title>

  <!-- Fonts & Favicon -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-dark:        #060608;
      --bg-card:        rgba(17, 17, 22, 0.82);
      --gold-primary:   #dfba73;
      --gold-light:     #f7e7c4;
      --gold-border:    rgba(223, 186, 115, 0.25);
      --gold-gradient:  linear-gradient(135deg, #f7e7c4 0%, #dfba73 35%, #c59b27 75%, #947012 100%);
      --text-main:      #ededf2;
      --text-muted:     #9a9aa8;
      --font-serif:     'Cinzel', Georgia, serif;
      --font-body:      'Plus Jakarta Sans', sans-serif;
      --radius-sm:      8px;
      --radius-lg:      20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background */
    .bg-ambience {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(223, 186, 115, 0.12) 0%, transparent 60%),
        linear-gradient(180deg, rgba(6, 6, 8, 0.75) 0%, rgba(6, 6, 8, 0.94) 100%),
        url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=1600&auto=format&fit=crop&q=80');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 2;
      width: min(460px, 100%);
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      padding: clamp(2rem, 6vw, 3rem);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(223, 186, 115, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--gold-gradient);
    }

    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .login-logo img {
      height: 52px;
      width: auto;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-primary);
      background: rgba(223, 186, 115, 0.1);
      border: 1px solid var(--gold-border);
      padding: 0.25rem 0.9rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    .login-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .login-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--gold-primary);
      pointer-events: none;
      display: flex;
    }

    .form-input {
      width: 100%;
      background: rgba(10, 10, 14, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(223, 186, 115, 0.2);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
    }

    .toggle-pass-btn:hover {
      color: var(--gold-primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--gold-gradient);
      color: #0c0c0f;
      border: none;
      padding: 0.95rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(197, 155, 39, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(223, 186, 115, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-alert {
      display: none;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .error-alert.show {
      display: block;
    }

    .portal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .portal-footer a {
      color: var(--gold-primary);
      text-decoration: none;
    }

    .portal-footer a:hover {
      color: var(--gold-light);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bg-ambience" aria-hidden="true"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <a href="./index.html" aria-label="Go to homepage">
          <img src="./assets/logo.svg" alt="Bearded Guys Barbershop" width="220" height="52" />
        </a>
      </div>

      <div class="login-header">
        <div class="portal-badge">
          <span>🔒</span> Secure Owner Access
        </div>
        <h1 class="login-title">BARBER PORTAL</h1>
        <p class="login-sub">Sign in to manage your portfolio, gallery uploads &amp; settings.</p>
      </div>

      <div class="error-alert" id="error-alert" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Owner Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="owner@beardedguys.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••••••"
              autocomplete="current-password"
              minlength="6"
              required
            />
            <button type="button" class="toggle-pass-btn" id="toggle-pass-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span>⚡</span> Sign In to Dashboard
        </button>
      </form>

      <div class="portal-footer">
        <a href="./index.html">← Back to Public Website</a>
        <span>EST. 2018</span>
      </div>
    </div>
  </div>

  <!-- Config & Scripts -->
  <script src="./js/config.js"></script>
  <script type="module">
    import { loginWithEmail, getSession } from './js/auth.js';

    // Auto redirect if already logged in
    const existing = await getSession();
    if (existing) {
      window.location.href = 'admin.html';
    }

    // Toggle password reveal
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pass-btn');
    toggleBtn?.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    });

    // Form submission
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertEl = document.getElementById('error-alert');

    function showError(msg) {
      alertEl.textContent = msg;
      alertEl.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.classList.remove('show');

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing In...';

      const { data, error } = await loginWithEmail(email, password);

      if (error) {
        showError(error.message || 'Invalid login credentials. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>⚡</span> Sign In to Dashboard';
        return;
      }

      // Success
      window.location.href = 'admin.html';
    });
  </script>

</body>
</html>
