<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Print Room — Bearded Guys Admin</title>

  <!-- Fonts & Favicon -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />

  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>

  <!-- Topbar -->
  <header class="admin-topbar">
    <div class="container topbar-inner">
      <div class="admin-brand">
        <a href="./index.html" aria-label="View website">
          <img src="./assets/logo.svg" alt="Bearded Guys Logo" />
        </a>
        <h1 class="admin-title">THE PRINT ROOM</h1>
      </div>
      
      <div class="topbar-actions">
        <div class="admin-user">
          <div class="admin-avatar" id="admin-user-avatar">O</div>
          <span id="admin-user-email">owner@beardedguys.com</span>
        </div>
        <button class="btn btn-outline" id="signout-btn" type="button">
          Sign Out
        </button>
        <a href="./index.html" target="_blank" rel="noopener" class="btn btn-ink">
          View Site
        </a>
      </div>
    </div>
  </header>

  <main class="admin-body container">

    <!-- ── Upload New Photos ─────────────────────────────────────────── -->
    <section id="upload-section">
      <div class="section-header">
        <h2 class="section-title">New Print</h2>
      </div>

      <div class="upload-wrapper">
        <div class="drop-zone" id="drop-zone">
          <div class="dz-icon">📷</div>
          <div class="dz-main-text" id="dz-main-text">Drop Client Photos Here</div>
          <div class="dz-sub-text" id="dz-sub-text">or click to browse your files</div>
          <button type="button" class="btn btn-outline" id="choose-files-btn" style="margin-top:0.5rem;">
            Select Photos
          </button>
        </div>

        <input
          type="file"
          id="file-input"
          accept="image/jpeg,image/png,image/webp,image/avif"
          multiple
          style="display: none;"
        />

        <div class="upload-meta">
          <div class="input-group">
            <label for="upload-title-input">Caption / Title (Optional)</label>
            <input
              type="text"
              id="upload-title-input"
              class="input-field"
              placeholder="e.g. Mid Drop Skin Fade"
            />
          </div>

          <div class="input-group">
            <label for="upload-cat-select">Haircut Type</label>
            <input 
              type="text" 
              id="upload-cat-select" 
              class="input-field" 
              placeholder="e.g. Skin Fade, Taper, Beard Trim"
            />
          </div>
        </div>

        <button type="button" class="btn btn-ink" id="start-upload-btn" style="width: 100%; margin-top: -0.5rem;" disabled>
          Upload Print
        </button>

        <div class="upload-progress-wrapper" id="upload-progress-wrap">
          <div style="display:flex; justify-content:space-between; font-family:var(--font-labels); font-size:0.9rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft);">
            <span id="upload-status-text">Processing...</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-bar-fill"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Live Portfolio Gallery Grid ───────────────────────────────── -->
    <section>
      <div class="section-header">
        <h2 class="section-title">Live Portfolio Archive</h2>
      </div>

      <div class="admin-gallery-grid" id="admin-gallery-grid">
        <!-- Loaded dynamically by js/admin.js -->
      </div>
    </section>

  </main>

  <!-- Config & Engine -->
  <script src="./js/config.js"></script>
  <script type="module" src="./js/admin.js"></script>

</body>
</html>
